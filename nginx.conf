# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name foodcourt.fun www.foodcourt.fun;
    return 301 https://$host$request_uri;
}

# Main HTTPS + HTTP/2 server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name foodcourt.fun www.foodcourt.fun;

    # SSL certificates (certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/foodcourt.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodcourt.fun/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (optional but recommended)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root  /var/www/foodcourt/dist;
    index index.html;

    # Serve pre-compressed gzip files if available (generated by webpack CompressionPlugin)
    gzip_static on;

    # Static assets with content-hash in filename → long-term cache
    location ~* \.(js|css|woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML and service worker → no cache
    location ~* (\.html|sw\.js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # API reverse-proxy
    location /api/ {
        proxy_pass http://localhost:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
