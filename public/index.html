<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://nancats-bucket.storage.yandexcloud.net/favicon.ico"
    />
    <title>FoodCourt — доставка еды из ресторанов</title>
    <meta
      name="description"
      content="FoodCourt — сервис доставки еды: рестораны, кафе и магазины рядом с вами. Заказывайте блюда онлайн с быстрой доставкой."
    />
    <meta
      name="keywords"
      content="доставка еды, заказать еду, рестораны, доставка из ресторанов, еда онлайн, FoodCourt, фудкорт"
    />
    <meta name="author" content="NaNcats" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fda522" />
    <link rel="canonical" href="https://foodcourt.fun/" />

    <!-- Open Graph (соцсети, мессенджеры) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FoodCourt" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://foodcourt.fun/" />
    <meta property="og:title" content="FoodCourt — доставка еды из ресторанов" />
    <meta
      property="og:description"
      content="Рестораны, кафе и магазины рядом с вами. Заказывайте блюда онлайн с быстрой доставкой."
    />
    <meta
      property="og:image"
      content="https://nancats-bucket.storage.yandexcloud.net/favicon.ico"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,300&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://api-maps.yandex.ru/2.1/?apikey=<%= yandexKey %>&lang=ru_RU"
      type="text/javascript"
    ></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
